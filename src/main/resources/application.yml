server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: travel-insurance

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/travel_insurance}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    repair-on-migrate: true
    out-of-order: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:travel}
    password: ${RABBITMQ_PASSWORD:travel}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:108000}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  encryption:
    data-key: ${APP_ENCRYPTION_KEY}
    blind-index-key: ${APP_ENCRYPTION_BLIND_INDEX_KEY}
  mail:
    from: ${MAIL_FROM:no-reply@travelinsurance.example}
    emergency-assistance:
      phone: ${EMERGENCY_ASSISTANCE_PHONE:}
      email: ${EMERGENCY_ASSISTANCE_EMAIL:}
  ekyc:
    client-id: ${EKYC_CLIENT_ID:}
    client-secret: ${EKYC_CLIENT_SECRET:}
    access-token-url: ${EKYC_ACCESS_TOKEN_URL:https://dev.hakika.ecs.africa/api/v2/auth/access-token}
    verification-url: ${EKYC_VERIFICATION_URL:https://dev.hakika.ecs.africa/api/v3/requests/embeded}
    callback-resend-url: ${EKYC_CALLBACK_RESEND_URL:https://dev.hakika.ecs.africa/api/v3/requests/callback/resend}
    notification-callback-url: ${EKYC_NOTIFICATION_CALLBACK_URL:}
    callback-allowed-ips: ${EKYC_CALLBACK_ALLOWED_IPS:167.71.142.137,167.71.128.93}
  exchangerate:
    base-url: ${EXCHANGE_RATE_BASE_URL:https://v6.exchangerate-api.com/v6}
    api-key: ${EXCHANGE_RATE_API_KEY:}

procedure:
  upload:
    max-file-size-bytes: ${PROCEDURE_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}   # 5 MB
    max-rows: ${PROCEDURE_UPLOAD_MAX_ROWS:5000}
    batch-size: ${PROCEDURE_UPLOAD_BATCH_SIZE:100}
    max-name-length: ${PROCEDURE_UPLOAD_MAX_NAME_LENGTH:255}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
