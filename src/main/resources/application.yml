server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: travel-insurance

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/travel_insurance}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:travel}
    password: ${RABBITMQ_PASSWORD:travel}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
