<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 0; }
        * { box-sizing: border-box; }
        body { font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40pt 0; background: #d9d9d9; }
        .receipt { width: 220pt; margin: 0 auto; background: #ffffff; padding: 4pt 16pt 10pt 16pt; color: #1a1a1a; }
        .tear { width: 220pt; margin: 0 auto; text-align: center; font-size: 10pt; line-height: 6pt;
                letter-spacing: -1.5pt; color: #d9d9d9; background: #ffffff; overflow: hidden; white-space: nowrap; }
        .tear-top { padding-top: 4pt; }
        .tear-bottom { padding-bottom: 4pt; }
        .masthead { width: 100%; text-align: center; margin-top: 4pt; }
        .logo-img { max-width: 120pt; max-height: 36pt; }
        .logo-box { width: 120pt; height: 36pt; margin: 0 auto; border: 0.75pt dashed #9a9a9a;
                    color: #9a9a9a; text-align: center; font-size: 6.5pt; letter-spacing: 1pt; }
        .logo-box div { padding-top: 13pt; }
        h1 { text-align: center; font-size: 13pt; letter-spacing: 1pt; margin: 6pt 0 4pt 0; }
        .subline { text-align: center; font-size: 8.5pt; margin: 1pt 0; }
        .stars { text-align: center; font-size: 9pt; margin: 6pt 0; }
        .divider { border-top: 1pt dashed #999; margin: 6pt 0; }
        table.items { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
        table.items td { padding: 2pt 0; vertical-align: top; }
        table.items .num { text-align: right; white-space: nowrap; }
        table.items .amount { padding-left: 8pt; }
        .total-row td { font-weight: bold; font-size: 9.5pt; padding-top: 3pt; }
        .barcode { text-align: center; margin: 10pt 0 2pt 0; font-size: 15pt; font-weight: bold;
                   letter-spacing: -1pt; font-family: 'Courier New', Courier, monospace;
                   white-space: nowrap; overflow: hidden; }
        .barcode-caption { text-align: center; font-size: 7.5pt; letter-spacing: 3pt; margin-top: -2pt; }
        .thankyou { text-align: center; font-size: 9.5pt; font-weight: bold; letter-spacing: 1pt; margin-top: 8pt; }
    </style>
</head>
<body>
<div class="tear tear-top">&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;&#9660;</div>
<div class="receipt">
    <div class="masthead">
        <img th:if="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-img" th:src="${insurerLogoUrl}" alt="Insurer logo"/>
        <div th:unless="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-box"><div>[ INSURER LOGO ]</div></div>
    </div>
    <h1>PREMIUM RECEIPT</h1>
    <div class="subline" th:text="${receipt.insurerName}"></div>
    <div class="subline" th:text="${generatedDate}"></div>
    <div class="stars">***</div>

    <div class="divider"></div>
    <table class="items">
        <tr>
            <td>Visitor</td>
            <td class="num" th:text="${receipt.visitorFullName}"></td>
        </tr>
        <tr>
            <td>Passport No.</td>
            <td class="num" th:text="${receipt.passportNumber}"></td>
        </tr>
    </table>

    <div class="divider"></div>
    <table class="items">
        <tr>
            <td>PCF Levy</td>
            <td class="num" th:text="${#numbers.formatPercent(receipt.pcfLevy, 1, 2)}"></td>
            <td class="num amount" th:text="${#numbers.formatDecimal(pcfLevyAmount, 1, 3)}"></td>
        </tr>
        <tr>
            <td>Insurance Premium Levy</td>
            <td class="num" th:text="${#numbers.formatPercent(receipt.insurancePremiumLevy, 1, 2)}"></td>
            <td class="num amount" th:text="${#numbers.formatDecimal(insurancePremiumLevyAmount, 1, 3)}"></td>
        </tr>
        <tr>
            <td>Training Levy</td>
            <td class="num" th:text="${#numbers.formatPercent(receipt.trainingLevy, 1, 2)}"></td>
            <td class="num amount" th:text="${#numbers.formatDecimal(trainingLevyAmount, 1, 3)}"></td>
        </tr>
        <tr>
            <td>Stamp Duty</td>
            <td class="num" th:text="${#numbers.formatDecimal(receipt.stampDuty, 1, 2)}"></td>
            <td class="num amount">0.308</td>
        </tr>
    </table>

    <div class="divider"></div>
    <table class="items total-row">
        <tr>
            <td>TOTAL PREMIUM (USD)</td>
            <td class="num" th:text="${#numbers.formatDecimal(receipt.totalPremium, 1, 2)}"></td>
        </tr>
    </table>
    <div class="divider"></div>

    <div class="barcode">|| | |||| | ||| || | ||| |</div>
    <div class="barcode-caption" th:text="${receipt.passportNumber}"></div>
    <div class="stars">***</div>
    <div class="thankyou">THANK YOU</div>
</div>
<div class="tear tear-bottom">&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;&#9650;</div>
</body>
</html>
