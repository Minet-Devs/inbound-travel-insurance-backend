<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 1.5cm; }
        * { box-sizing: border-box; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #1a1a1a; margin: 0; padding: 0; }
        .voucher { border: 0.75pt solid #cccccc; }
        .masthead { padding: 12pt 14pt 0 14pt; text-align: center; }
        .logo-img { max-height: 34pt; max-width: 160pt; }
        .logo-box { width: 160pt; height: 34pt; margin: 0 auto; border: 0.75pt dashed #9a9a9a;
                    color: #9a9a9a; text-align: center; font-size: 7pt; letter-spacing: 1pt; }
        .logo-box div { padding-top: 12pt; }
        .banner { background: #c8102e; color: #ffffff; font-size: 15pt; font-weight: bold;
                   letter-spacing: 0.5pt; padding: 8pt 14pt; margin-top: 10pt; }
        .meta { width: 100%; border-collapse: collapse; padding: 6pt 14pt 0 14pt; }
        .meta td { padding: 6pt 14pt 0 14pt; font-size: 8.5pt; }
        .meta .label { color: #666; }
        .meta .value { font-weight: bold; }
        .section-header { background: #e6e6e6; color: #1a1a1a; font-weight: bold; font-size: 9pt;
                           padding: 4pt 14pt; margin: 10pt 14pt 0 14pt; }
        .section-content { border: 0.5pt solid #cccccc; padding: 6pt 14pt; margin: 0 14pt 0 14pt; }
        .fields { width: 100%; border-collapse: collapse; }
        .fields td { padding: 2pt 0; font-size: 8.5pt; vertical-align: top; }
        .fields .label { color: #666; width: 32%; }
        table.items { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
        table.items td { padding: 3pt 0; vertical-align: top; }
        table.items .num { text-align: right; white-space: nowrap; }
        table.items .amount { padding-left: 8pt; }
        .total-box { background: #e6e6e6; font-weight: bold; font-size: 10pt;
                      padding: 6pt 14pt; margin: 10pt 14pt 12pt 14pt; }
        .total-box table { width: 100%; }
        .total-box .num { text-align: right; }
        .thankyou { text-align: center; font-size: 9.5pt; font-weight: bold; letter-spacing: 1pt;
                    padding: 0 0 12pt 0; }
    </style>
</head>
<body>
<div class="voucher">
    <div class="masthead">
        <img th:if="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-img" th:src="${insurerLogoUrl}" alt="Insurer logo"/>
        <div th:unless="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-box"><div>[ INSURER LOGO ]</div></div>
    </div>
    <div class="banner">RECEIPT VOUCHER</div>

    <table class="meta">
        <tr>
            <td class="label">Insurer</td>
            <td class="value" th:text="${receipt.insurerName}"></td>
            <td class="label">Date Issued</td>
            <td class="value" th:text="${generatedDate}"></td>
        </tr>
    </table>

    <div class="section-header">VISITOR DETAILS</div>
    <div class="section-content">
        <table class="fields">
            <tr>
                <td class="label">Full Name</td>
                <td th:text="${receipt.visitorFullName}"></td>
                <td class="label">Passport No.</td>
                <td th:text="${receipt.passportNumber}"></td>
            </tr>
        </table>
    </div>

    <div class="section-header">PREMIUM BREAKDOWN</div>
    <div class="section-content">
        <table class="items">
            <tr>
                <td>PCF Levy</td>
                <td class="num" th:text="${#numbers.formatPercent(receipt.pcfLevy, 1, 2)}"></td>
                <td class="num amount" th:text="${#numbers.formatDecimal(pcfLevyAmount, 1, 3)}"></td>
            </tr>
            <tr>
                <td>Insurance Premium Levy</td>
                <td class="num" th:text="${#numbers.formatPercent(receipt.insurancePremiumLevy, 1, 2)}"></td>
                <td class="num amount" th:text="${#numbers.formatDecimal(insurancePremiumLevyAmount, 1, 3)}"></td>
            </tr>
            <tr>
                <td>Training Levy</td>
                <td class="num" th:text="${#numbers.formatPercent(receipt.trainingLevy, 1, 2)}"></td>
                <td class="num amount" th:text="${#numbers.formatDecimal(trainingLevyAmount, 1, 3)}"></td>
            </tr>
            <tr>
                <td>Stamp Duty</td>
                <td class="num" th:text="${#numbers.formatDecimal(receipt.stampDuty, 1, 2)}"></td>
                <td class="num amount">0.308</td>
            </tr>
        </table>
    </div>

    <div class="total-box">
        <table>
            <tr>
                <td>TOTAL PREMIUM (USD)</td>
                <td class="num" th:text="${#numbers.formatDecimal(receipt.totalPremium, 1, 2)}"></td>
            </tr>
        </table>
    </div>

    <div class="thankyou">THANK YOU</div>
</div>
</body>
</html>
