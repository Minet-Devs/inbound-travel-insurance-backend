<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 1.5cm; }
        * { box-sizing: border-box; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #1a1a1a; margin: 0; padding: 0; }
        .voucher { border: 0.75pt solid #cccccc; }
        .masthead { padding: 12pt 14pt 0 14pt; text-align: center; }
        .logo-img { max-height: 34pt; max-width: 160pt; }
        .logo-box { width: 160pt; height: 34pt; margin: 0 auto; border: 0.75pt dashed #9a9a9a;
                    color: #9a9a9a; text-align: center; font-size: 7pt; letter-spacing: 1pt; }
        .logo-box div { padding-top: 12pt; }
        .banner { background: #c8102e; color: #ffffff; font-size: 15pt; font-weight: bold;
                   letter-spacing: 0.5pt; padding: 8pt 14pt; margin-top: 10pt; }
        .address-row { margin: 10pt 14pt 0 14pt; }
        .address-table { width: 100%; border-collapse: separate; border-spacing: 8pt 0; }
        .address-box { width: 50%; border: 0.5pt solid #cccccc; padding: 6pt 8pt; vertical-align: top; }
        .address-label { color: #666; font-weight: bold; font-size: 7.5pt; letter-spacing: 0.5pt; margin-bottom: 2pt; }
        .address-name { font-weight: bold; font-size: 8.5pt; }
        .address-line { font-size: 8.5pt; margin-top: 2pt; }
        .meta { width: 100%; border-collapse: collapse; padding: 6pt 14pt 0 14pt; }
        .meta td { padding: 6pt 14pt 0 14pt; font-size: 8.5pt; }
        .meta .label { color: #666; }
        .meta .value { font-weight: bold; }
        .total-box { background: #e6e6e6; font-weight: bold; font-size: 10pt;
                      padding: 6pt 14pt; margin: 10pt 14pt 0 14pt; }
        .total-box table { width: 100%; }
        .total-box .num { text-align: right; }
        .words-box { border: 0.5pt solid #cccccc; font-size: 8.5pt;
                     padding: 6pt 14pt; margin: 0 14pt 12pt 14pt; }
        .words-label { font-weight: bold; margin-right: 4pt; }
        .thankyou { text-align: center; font-size: 9.5pt; font-weight: bold; letter-spacing: 1pt;
                    padding: 0 0 12pt 0; }
    </style>
</head>
<body>
<div class="voucher">
    <div class="masthead">
        <img th:if="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-img" th:src="${insurerLogoUrl}" alt="Insurer logo"/>
        <div th:unless="${!#strings.isEmpty(insurerLogoUrl)}" class="logo-box"><div>[ INSURER LOGO ]</div></div>
    </div>
    <div class="banner">RECEIPT VOUCHER</div>

    <div class="address-row">
        <table class="address-table">
            <tr>
                <td class="address-box">
                    <div class="address-label">RECEIVED FROM</div>
                    <div class="address-name" th:text="${receipt.visitorFullName}"></div>
                    <div class="address-line" th:if="${!#strings.isEmpty(receipt.visitorAddress)}" th:text="${receipt.visitorAddress}"></div>
                    <div class="address-line" th:if="${!#strings.isEmpty(receipt.visitorNationality)}" th:text="${receipt.visitorNationality}"></div>
                </td>
                <td class="address-box">
                    <div class="address-name" th:text="${receipt.insurerName}"></div>
                    <div class="address-line" th:if="${!#strings.isEmpty(receipt.insurerAddress)}" th:text="${receipt.insurerAddress} + ', Kenya'"></div>
                </td>
            </tr>
        </table>
    </div>

    <table class="meta">
        <tr>
            <td class="label">Receipt No.</td>
            <td class="value" th:text="${receipt.certificateSerialNumber}"></td>
            <td class="label">Date Issued</td>
            <td class="value" th:text="${generatedDate}"></td>
        </tr>
        <tr>
            <td class="label">Insurer</td>
            <td class="value" th:text="${receipt.insurerName}"></td>
        </tr>
        <tr>
            <td class="label">Account No.</td>
            <td class="value" th:text="${receipt.passportNumber}"></td>
            <td class="label">Account Name</td>
            <td class="value" th:text="${receipt.visitorFullName}"></td>
        </tr>
    </table>

    <div class="total-box">
        <table>
            <tr>
                <td>TOTAL AMOUNT RECEIVED:</td>
                <td class="num" th:text="'USD ' + ${#numbers.formatDecimal(receipt.totalPremium, 1, 2)}"></td>
            </tr>
        </table>
    </div>

    <div class="words-box">
        <span class="words-label">TOTAL AMOUNT RECEIVED IN WORDS:</span>
        <span th:text="${totalPremiumInWords}"></span>
    </div>

    <div class="thankyou">THANK YOU</div>
</div>
</body>
</html>
